name: Deploy Media Intake

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit SHA or branch to validate and deploy
        required: true
        default: main
        type: string
      confirmation:
        description: Type DEPLOY_MEDIA_INTAKE to make production changes
        required: true
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: babyready-media-intake-production
  cancel-in-progress: false

env:
  PROJECT_ID: babyready-8bfd6
  REGION: us-central1
  SERVICE_NAME: babyready-media-intake-worker

jobs:
  verify:
    name: Validate selected revision
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Require a revision already present on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "deployed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: revision

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install app dependencies
        run: npm ci

      - name: Verify Media Intake files are present
        run: |
          test -f services/media-intake-worker/package.json
          test -f services/media-intake-worker/index.mjs
          test -f scripts/deploy-media-intake-worker.mjs
          test -f firestore.rules

      - name: Typecheck app
        run: npm run typecheck

      - name: Test Firestore security rules
        run: npm run test:emulators

      - name: Check worker syntax
        run: npm run check:media-intake-worker

      - name: Export web bundle
        run: npm run export:web

  deploy:
    name: Deploy worker and Firestore rules
    needs: verify
    if: inputs.confirmation == 'DEPLOY_MEDIA_INTAKE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Require a revision already present on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "deployed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: revision

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify target and runtime service account
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          test "$(gcloud config get-value project)" = "$PROJECT_ID"
          gcloud iam service-accounts describe \
            "babyready-media-intake-worker@${PROJECT_ID}.iam.gserviceaccount.com" \
            --project "$PROJECT_ID" \
            --format='value(email)'

      - name: Deploy Media Intake worker
        run: npm run deploy:media-intake-worker
        id: worker_deploy
        continue-on-error: true

      - name: Diagnose a failed worker health check
        if: steps.worker_deploy.outcome == 'failure'
        run: |
          set -u
          echo '## Cloud Run health-check diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Service configuration' >> "$GITHUB_STEP_SUMMARY"
          gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.annotations,status.url,status.latestReadyRevisionName,status.traffic)' \
            | tee -a "$GITHUB_STEP_SUMMARY"

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Authenticated local proxy probe' >> "$GITHUB_STEP_SUMMARY"
          gcloud run services proxy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --port 8081 \
            > /tmp/cloud-run-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:8081/healthz; then
              echo 'Local proxy health check passed.' | tee -a "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep "$attempt"
          done
          cat /tmp/cloud-run-proxy.log | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Recent Cloud Run request logs' >> "$GITHUB_STEP_SUMMARY"
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE_NAME"'"' \
            --project "$PROJECT_ID" \
            --freshness 15m \
            --limit 20 \
            --format='table(timestamp,httpRequest.status,httpRequest.requestUrl,severity,textPayload)' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Stop before Firestore rules when worker health fails
        if: steps.worker_deploy.outcome == 'failure'
        run: |
          echo 'STOP: The Media Intake worker did not pass its health check. Firestore rules were not deployed.'
          exit 1

      - name: Confirm worker health
        if: steps.worker_deploy.outcome == 'success'
        run: |
          set -euo pipefail
          WORKER_URL="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$WORKER_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${WORKER_URL}/healthz"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        id: worker

      - name: Deploy Firestore rules
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules \
            --project "$PROJECT_ID"

      - name: Publish deployment summary
        run: |
          {
            echo '## Media Intake deployment complete'
            echo ''
            echo "- Revision: \`${{ steps.revision.outputs.deployed_sha }}\`"
            echo "- Project: \`${PROJECT_ID}\`"
            echo "- Worker: ${{ steps.worker.outputs.worker_url }}"
            echo ''
            echo 'Next: set `EXPO_PUBLIC_MEDIA_INTAKE_WORKER_URL` in the EAS production environment to the Worker URL above, then create a new production build.'
          } >> "$GITHUB_STEP_SUMMARY"
