name: Deploy Media Intake

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: main or a 7- to 40-character commit SHA already present on main
        required: true
        default: main
        type: string
      confirmation:
        description: Type DEPLOY_MEDIA_INTAKE to make production changes
        required: true
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: babyready-media-intake-production
  cancel-in-progress: false

env:
  PROJECT_ID: babyready-8bfd6
  REGION: us-central1
  SERVICE_NAME: babyready-media-intake-worker

jobs:
  verify:
    name: Validate selected revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed_sha: ${{ steps.revision.outputs.deployed_sha }}

    steps:
      - name: Check out main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve a revision already present on main
        env:
          REQUESTED_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

          if [ "$REQUESTED_REF" = 'main' ]; then
            DEPLOYED_SHA="$(git rev-parse origin/main)"
          elif [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            DEPLOYED_SHA="$(git rev-parse --verify "${REQUESTED_REF}^{commit}")"
          else
            echo 'git_ref must be main or a 7- to 40-character commit SHA.' >&2
            exit 1
          fi

          git merge-base --is-ancestor "$DEPLOYED_SHA" origin/main
          git checkout --detach "$DEPLOYED_SHA"
          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
        id: revision

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install app dependencies
        run: npm ci

      - name: Verify Media Intake files are present
        run: |
          test -f services/media-intake-worker/package.json
          test -f services/media-intake-worker/index.mjs
          test -f scripts/deploy-media-intake-worker.mjs
          test -f firestore.rules

      - name: Typecheck app
        run: npm run typecheck

      - name: Test Firestore security rules
        run: npm run test:emulators

      - name: Check worker syntax
        run: npm run check:media-intake-worker

      - name: Export web bundle
        run: npm run export:web

  deploy:
    name: Deploy worker and Firestore rules
    needs: verify
    if: inputs.confirmation == 'DEPLOY_MEDIA_INTAKE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.deployed_sha }}
          fetch-depth: 0

      - name: Require a revision already present on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "deployed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: revision

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify target and runtime service account
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          test "$(gcloud config get-value project)" = "$PROJECT_ID"
          gcloud iam service-accounts describe \
            "babyready-media-intake-worker@${PROJECT_ID}.iam.gserviceaccount.com" \
            --project "$PROJECT_ID" \
            --format='value(email)'

      - name: Deploy Media Intake worker
        run: npm run deploy:media-intake-worker
        env:
          MEDIA_INTAKE_SKIP_HEALTH_CHECK: 'true'
        id: worker_deploy
        continue-on-error: true

      - name: Read worker URL for the health-check audience
        if: steps.worker_deploy.outcome == 'success'
        run: |
          set -euo pipefail
          WORKER_URL="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        id: worker_target

      - name: Create an ID token for the worker health check
        if: steps.worker_target.outcome == 'success'
        id: worker_health_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: false
          token_format: id_token
          id_token_audience: ${{ steps.worker_target.outputs.worker_url }}

      - name: Confirm worker health with an ID token
        if: steps.worker_health_auth.outcome == 'success'
        run: |
          set -euo pipefail
          WORKER_URL="${{ steps.worker_target.outputs.worker_url }}"
          ID_TOKEN="${{ steps.worker_health_auth.outputs.id_token }}"
          test -n "$WORKER_URL"
          test -n "$ID_TOKEN"

          probe_health() {
            local label="$1"
            local authorization="$2"
            local header_file body_file http_status
            header_file="$(mktemp)"
            body_file="$(mktemp)"

            local -a curl_args=(
              --silent
              --show-error
              --retry 5
              --retry-all-errors
              --connect-timeout 10
              --max-time 30
              --dump-header "$header_file"
              --output "$body_file"
              --write-out '%{http_code}'
            )
            if [ -n "$authorization" ]; then
              curl_args+=(-H "Authorization: Bearer $authorization")
            fi

            http_status="$(curl "${curl_args[@]}" "${WORKER_URL}/healthz" || true)"
            {
              echo "### ${label}"
              echo ""
              echo "- URL: \`${WORKER_URL}/healthz\`"
              echo "- HTTP status: \`${http_status:-curl transport error}\`"
              echo "- Response headers:"
              echo '```text'
              sed 's/\r$//' "$header_file" \
                | grep -Eiv '^(set-cookie|www-authenticate):' \
                | tail -40 || true
              echo '```'
              echo "- Response body preview:"
              echo '```text'
              tr '\r\n' ' ' < "$body_file" | cut -c1-1000
              echo ''
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"

            test "$http_status" = '200'
          }

          echo '## Direct worker health probes' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"

          if probe_health 'Public transport probe' ''; then
            echo 'Public transport probe passed.'
          else
            echo 'Public transport probe failed.' >&2
          fi

          if ! probe_health 'ID-token probe' "$ID_TOKEN"; then
            echo 'STOP: The worker did not return HTTP 200 to the audience-bound ID-token probe.' >&2
            exit 1
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        id: worker_health

      - name: Diagnose a failed worker health check
        if: |
          always() && (
            steps.worker_deploy.outcome != 'success' ||
            steps.worker_target.outcome != 'success' ||
            steps.worker_health_auth.outcome != 'success' ||
            steps.worker_health.outcome != 'success'
          )
        run: |
          set -u
          echo '## Cloud Run health-check diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Service configuration' >> "$GITHUB_STEP_SUMMARY"
          gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.annotations,status.url,status.latestReadyRevisionName,status.traffic)' \
            | tee -a "$GITHUB_STEP_SUMMARY"

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Cloud Run invoker policy' >> "$GITHUB_STEP_SUMMARY"
          gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Authenticated local proxy probe' >> "$GITHUB_STEP_SUMMARY"
          gcloud components install cloud-run-proxy --quiet
          gcloud run services proxy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --port 8081 \
            > /tmp/cloud-run-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT
          PROXY_HEALTH_PASSED=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8081/healthz; then
              echo 'Local proxy health check passed.' | tee -a "$GITHUB_STEP_SUMMARY"
              PROXY_HEALTH_PASSED=true
              break
            fi
            sleep 1
          done
          if [ "$PROXY_HEALTH_PASSED" != true ]; then
            echo 'Local proxy health check did not become available within 30 seconds.' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          cat /tmp/cloud-run-proxy.log | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Recent Cloud Run request logs' >> "$GITHUB_STEP_SUMMARY"
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE_NAME"'"' \
            --project "$PROJECT_ID" \
            --freshness 15m \
            --limit 20 \
            --format='table(timestamp,httpRequest.status,httpRequest.requestUrl,severity,textPayload)' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Recent VPC Service Controls policy audit events' >> "$GITHUB_STEP_SUMMARY"
          gcloud logging read \
            'resource.type="audited_resource" AND log_id("cloudaudit.googleapis.com/policy") AND resource.labels.method="run.googleapis.com/HttpIngress"' \
            --project "$PROJECT_ID" \
            --freshness 15m \
            --limit 20 \
            --format='table(timestamp,protoPayload.status.code,protoPayload.status.message)' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Stop before Firestore rules when worker health fails
        if: |
          always() && (
            steps.worker_deploy.outcome != 'success' ||
            steps.worker_target.outcome != 'success' ||
            steps.worker_health_auth.outcome != 'success' ||
            steps.worker_health.outcome != 'success'
          )
        run: |
          echo 'STOP: The Media Intake worker did not pass its authenticated health check. Firestore rules were not deployed.'
          exit 1

      - name: Deploy Firestore rules
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules \
            --project "$PROJECT_ID"

      - name: Publish deployment summary
        run: |
          {
            echo '## Media Intake deployment complete'
            echo ''
            echo "- Revision: \`${{ steps.revision.outputs.deployed_sha }}\`"
            echo "- Project: \`${PROJECT_ID}\`"
            echo "- Worker: ${{ steps.worker_health.outputs.worker_url }}"
            echo ''
            echo 'Next: set `EXPO_PUBLIC_MEDIA_INTAKE_WORKER_URL` in the EAS production environment to the Worker URL above, then create a new production build.'
          } >> "$GITHUB_STEP_SUMMARY"
