name: Verify BabyReady

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck and Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check lessons against the quality rules
        run: npm run test:lessons

      - name: Run Firestore Emulator security-rule tests
        run: npm run test:emulators
