name: Deploy website

# Builds the web app from main and deploys it, with the Firestore rules and
# indexes, to production, the same as `npm run deploy:production` on a PC. It
# never runs on its own: start it from GitHub, Actions tab, "Deploy website",
# "Run workflow". Setup: docs/deploy-website.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy the website on main to production
        required: true

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to babyready-8bfd6
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public Firebase web-app values (they ship inside the app), read from
      # repository variables, or from secrets of the same names if saved there.
      FIREBASE_PROJECT_ID: babyready-8bfd6
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: babyready-8bfd6
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID || secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      # The App Store page; leave unset until the app is live.
      EXPO_PUBLIC_APP_STORE_URL: ${{ vars.EXPO_PUBLIC_APP_STORE_URL }}
      EXPO_PUBLIC_USE_FIREBASE_EMULATORS: 'false'

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lessons
        run: npm run test:lessons

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_KEY }}

      # Checks the Firebase values, builds the web app with a clean cache, and
      # deploys hosting and Firestore rules and indexes.
      - name: Build and deploy
        run: npm run deploy:production
