t slowly and the tissue has time to stretch. Warm compresses and gentle perineal massage during this stage can lower the risk of more serious tears.", "sourceIds": ["acog-pb198", "aafp-lacerations"], "visual": {"kind": "illustration", "description": "Non-graphic illustration: provider holding a warm cloth, laboring person breathing slowly, support person close by saying 'almost there'."}}, {"id": "tears", "type": "content", "heading": "Tearing and episiotomy", "onScreen": ["Some tearing is common, especially with a first baby", "Most tears are small and heal well", "An episiotomy (a small cut) is only done when needed", "Ask about perineal massage in late pregnancy"], "narration": "Many people worry about tearing, so let's talk about it honestly. Some tearing is common, especially with a first vaginal birth. Most tears are small. They involve only skin or shallow muscle, and they heal well, sometimes with a few stitches. More serious tears are much less common. An episiotomy is a small cut your provider can make to widen the opening. It used to be routine, but today it's only done when there's a specific reason. And here's something you can do now: ask your care team about perineal massage in the last weeks of pregnancy, which can reduce tearing for some first-time parents.", "sourceIds": ["acog-pb198", "aafp-lacerations"], "visual": {"kind": "icon-list", "description": "Three reassuring icons: a check mark (most tears are small), a bandage (heal well), a calendar (ask about late-pregnancy perineal massage)."}}, {"id": "pushing-video", "type": "video", "heading": "Pushing positions, demonstrated", "onScreen": ["Try these with your support person at home"], "narration": "Let's watch a short demonstration of pushing positions you can practice ahead of time.", "sourceIds": ["acog-co766"], "video": {"brief": "Clothed demonstration with a childbirth educator, a pregnant person, and a partner: side-lying with leg support, hands and knees, supported squat, semi-sitting with partner holding a leg. Shows how a partner can help in each. Notes which work with an epidural. No birth footage.", "maxSeconds": 90}}, {"id": "baby-is-born", "type": "content", "heading": "Your baby is born", "onScreen": ["First the head, then the shoulders turn and slip out", "The rest of the body follows quickly", "If baby is doing well, they go right onto your chest", "Babies may look bluish or be covered in a white coating at first"], "narration": "Once your baby's head is born, the shoulders turn and slip out, and the rest of the body follows quickly. If your baby is doing well, they can be placed right onto your bare chest, dried off, and covered with a warm blanket. Don't be surprised by how your baby looks at first. Newborns are often a little bluish until they start breathing, and may be covered in a white, creamy coating that protects their skin. In the next lesson, we'll talk about that first precious hour together.", "sourceIds": ["aap-breastfeeding-2022"], "visual": {"kind": "illustration", "description": "Newborn on parent's chest, skin to skin, under a warm blanket, parent's hand on baby's back, partner leaning in."}}, {"id": "support-while-pushing", "type": "comparison", "heading": "Support person: how to help with pushing", "onScreen": ["Short, steady encouragement goes a long way"], "narration": "Support people, pushing is hard, focused work, and you can make a real difference. Offer short, steady encouragement. Give sips of water and a cool cloth between contractions. Help hold a leg or support a position if asked. Tell them about progress, if they want to know. And stay close. Your presence matters more than finding perfect words.", "sourceIds": ["acog-co766"], "columns": ["Try", "Instead of"], "rows": [["\"You're doing it. Each push is working.\"", "Long speeches or lots of questions"], ["Sips of water, a cool cloth", "Leaving the room for long stretches"], ["Holding a leg or hand when asked", "Guessing what they need"], ["Sharing progress, if they want it", "Comparing to other births"]], "visual": {"kind": "comparison-table", "description": "Two-column table of helpful and less helpful support."}}, {"id": "fast-birth", "type": "safety", "heading": "If birth happens before you reach care", "onScreen": ["Call 911; the dispatcher will guide you", "If driving, pull over safely", "Don't try to slow or hold the baby back", "Put baby skin to skin and keep both of you warm", "Don't pull on the cord; wait for help"], "narration": "Very fast births are uncommon, but it's good to know what to do. If birth seems to be happening before you can reach your care team, call 911. The dispatcher will talk you through it. If you're driving, pull over somewhere safe. Don't try to hold your baby back. Once your baby is born, put them skin to skin on the parent's chest, dry them, and cover you both with a blanket or towel to keep warm. Don't pull on the umbilical cord. Wait for emergency help to arrive.", "sourceIds": ["aap-breastfeeding-2022"]}, {"id": "pushing-preferences", "type": "reflection", "heading": "Your pushing preferences", "onScreen": ["Positions you'd like to try", "How you'd like to be encouraged", "Would you like a mirror, or to touch baby's head?", "Questions about tearing or perineal massage"], "narration": "Let's add your pushing preferences to your Birth Readiness Brief. Note the positions you'd like to try, how you'd like to be encouraged, whether you'd like a mirror or to reach down and touch your baby's head as they crown, and any questions you want to ask your care team about tearing or perineal massage.", "sourceIds": [], "savesTo": "birthReadinessBrief", "prompt": "Write positions to try, how you'd like to be encouraged, whether you'd like a mirror or to touch baby's head, and questions for your care team."}, {"id": "summary", "type": "summary", "heading": "What we covered", "onScreen": ["Pressure and an urge to push are normal", "Push with contractions; urge-guided or coached both work", "Many positions can work; try changing", "Crowning is brief; slow is good", "Most tears are small and heal well"], "narration": "Let's recap. Strong pressure and an urge to push are normal signs your baby is moving down. You'll push with your contractions, either following your body or with coaching, and both work. Many positions can help, so don't hesitate to change. Crowning is intense but brief, and going slowly helps protect your body. And while some tearing is common, most tears are small and heal well. Next, a few review questions.", "sourceIds": ["acog-cpg8-labor", "acog-pb198"]}], "reviewQuiz": [{"prompt": "Which statement about pushing positions is true?", "options": ["You must push lying flat on your back", "Many positions can work, and changing positions can help", "Positions don't matter at all"], "correctIndex": 1, "explanation": "Side-lying, hands and knees, squatting, and semi-sitting can all work. Ask your care team which ones they support."}, {"prompt": "Why might your provider ask you to push gently or breathe as your baby crowns?", "options": ["To slow things down so the tissue can stretch", "Because labor has stopped", "So you can rest for an hour"], "correctIndex": 0, "explanation": "Letting the head come out slowly gives tissue time to stretch, which can help reduce tearing."}, {"prompt": "What's true about episiotomy today?", "options": ["It's done for every vaginal birth", "It's only done when there's a specific reason", "It always prevents tearing"], "correctIndex": 1, "explanation": "Routine episiotomy is no longer recommended. Providers use it only when there's a specific reason."}], "nextLessonId": "placenta-and-first-hour"},{"courseId": "labor-basics", "lessonId": "placenta-and-first-hour", "order": 6, "title": "The Placenta and the First Hour", "learningGoals": ["Know what happens as the placenta is delivered", "Understand why medicine is given to prevent heavy bleeding", "Know the benefits of delayed cord clamping", "Understand skin-to-skin contact and the first feeding", "Recognize heavy bleeding after birth and act quickly"], "estimatedMinutes": 12, "review": {"status": "draft", "reviewedBy": null, "reviewedOn": null, "nextReviewBy": null, "notes": "Reviewer: delayed cord clamping is stated as 'at least 30 to 60 seconds' per ACOG CO 814; ACNM favors longer. Newborn medications (vitamin K, eye ointment, hepatitis B) are deferred to lesson 5.2. Heavy-bleeding thresholds are kept general; confirm wording against unit teaching."}, "sources": [{"id": "acog-co814", "organization": "ACOG", "title": "Delayed Umbilical Cord Clamping After Birth (Committee Opinion No. 814)", "url": "https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2020/12/delayed-umbilical-cord-clamping-after-birth", "verifiedOn": null}, {"id": "who-intrapartum-2018", "organization": "WHO", "title": "WHO Recommendations: Intrapartum Care for a Positive Childbirth Experience (2018)", "url": "https://www.who.int/publications/i/item/9789241550215", "verifiedOn": null}, {"id": "aap-breastfeeding-2022", "organization": "AAP", "title": "Breastfeeding and the Use of Human Milk (Policy Statement, 2022)", "url": "https://publications.aap.org/pediatrics/article/150/1/e2022057988/188347/", "verifiedOn": null}, {"id": "acog-apgar", "organization": "ACOG", "title": "The Apgar Score (Committee Opinion No. 644, with AAP)", "url": "https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2015/10/the-apgar-score", "verifiedOn": null}, {"id": "acog-pb198", "organization": "ACOG", "title": "Prevention and Management of Obstetric Lacerations at Vaginal Delivery (Practice Bulletin No. 198)", "url": "https://www.acog.org/clinical/clinical-guidance/practice-bulletin/articles/2018/09/prevention-and-management-of-obstetric-lacerations-at-vaginal-delivery", "verifiedOn": null}, {"id": "cdc-hear-her-warning-signs", "organization": "CDC", "title": "Hear Her: Urgent Maternal Warning Signs", "url": "https://www.cdc.gov/hearher/maternal-warning-signs/index.html", "verifiedOn": null}], "slides": [{"id": "welcome", "type": "title", "heading": "The Placenta and the First Hour", "onScreen": ["Labor Basics · Lesson 6", "About 12 minutes"], "narration": "Welcome to the final lesson of Labor Basics. Your baby is here. But a few important things still happen in the minutes and hours after birth: the placenta is delivered, your care team watches your bleeding, and you and your baby begin getting to know each other. Many people call this the golden hour. Let's walk through it.", "sourceIds": [], "visual": {"kind": "illustration", "description": "Dim, peaceful birth room: parent with newborn skin to skin under a blanket, partner sitting close, nurse quietly charting in the background."}}, {"id": "third-stage", "type": "content", "heading": "Delivering the placenta", "onScreen": ["Your uterus keeps contracting after birth", "The placenta separates and comes out, often with a small push", "Usually within about half an hour", "Your team checks that it's complete"], "narration": "After your baby is born, your uterus keeps contracting, usually more gently. These contractions help the placenta separate from the wall of your uterus. You may feel some cramping and pressure, and your provider may ask for a small push. The placenta usually comes out within about half an hour, and often much sooner. Your team will check that it came out complete, because any pieces left behind can cause bleeding. Many people barely notice this stage, because they're focused on their baby.", "sourceIds": ["who-intrapartum-2018"], "visual": {"kind": "diagram", "description": "Simple side view of a uterus after birth, contracting, with the placenta gently separating. Non-graphic, soft colors."}}, {"id": "preventing-bleeding", "type": "content", "heading": "Preventing heavy bleeding", "onScreen": ["Medicine (usually oxytocin) is given right after birth", "It helps your uterus contract and limits bleeding", "Your nurse will press on your belly to check your uterus", "It can be uncomfortable, but it's important"], "narration": "Right after birth, most care teams give a medicine, usually oxytocin, through your IV or as a shot. It helps your uterus contract firmly, which is how your body controls bleeding where the placenta was attached. This is recommended for every birth, because it lowers the risk of heavy bleeding. Over the next hours, your nurse will also press firmly on your belly to check that your uterus is staying firm. That can be uncomfortable, so breathe through it, and know it's an important safety check.", "sourceIds": ["who-intrapartum-2018"], "visual": {"kind": "illustration", "description": "Nurse gently placing a hand on a postpartum person's lower belly, both calm, baby on the parent's chest."}}, {"id": "cord-clamping", "type": "content", "heading": "Delayed cord clamping", "onScreen": ["Waiting at least 30 to 60 seconds before clamping the cord", "Gives your baby extra blood from the placenta", "Boosts iron stores for the first months of life", "Recommended for healthy term and preterm babies"], "narration": "After birth, the umbilical cord still carries blood from the placenta to your baby. Waiting to clamp it, at least 30 to 60 seconds, lets more of that blood reach your baby. For full-term babies, this boosts iron stores for the first several months of life. For premature babies, the benefits are even bigger. ACOG recommends delayed cord clamping for healthy babies, and it doesn't increase the birthing parent's risk of bleeding. Some midwives wait even longer. If your baby needs immediate help breathing, the team may clamp sooner.", "sourceIds": ["acog-co814"], "visual": {"kind": "illustration", "description": "Newborn on parent's chest with the cord still attached, a small timer graphic showing 30 to 60 seconds."}}, {"id": "checkin-cord", "type": "checkin", "heading": "Quick check-in", "onScreen": [], "narration": "Let's check in.", "sourceIds": ["acog-co814"], "question": {"prompt": "What's one main benefit of delayed cord clamping for a full-term baby?", "options": ["It shortens labor", "It boosts the baby's iron stores for the first months of life", "It prevents the need for stitches"], "correctIndex": 1, "explanation": "Waiting at least 30 to 60 seconds lets extra blood from the placenta reach your baby, which improves iron stores in early infancy."}}, {"id": "skin-to-skin", "type": "content", "heading": "Skin to skin", "onScreen": ["Baby goes on your bare chest right after birth", "Keeps baby warm and calm", "Helps steady breathing, heart rate, and blood sugar", "Often possible after a cesarean, too"], "narration": "If you and your baby are doing well, your baby can be placed directly on your bare chest right after birth, dried off, and covered with a warm blanket. This is called skin-to-skin contact. Your body is the perfect warmer. Skin to skin helps keep your baby warm and calm, and it helps steady their breathing, heart rate, and blood sugar. It also supports breastfeeding. Ask for at least the first hour without interruption if possible. Many hospitals offer it after a cesarean, too, and partners can do skin to skin as well.", "sourceIds": ["aap-breastfeeding-2022", "who-intrapartum-2018"], "visual": {"kind": "illustration", "description": "Close-up of newborn lying skin to skin on a parent's chest, cheek turned to the side, blanket over both."}}, {"id": "first-feeding", "type": "content", "heading": "The first feeding", "onScreen": ["Many babies are ready to feed within the first hour", "Watch for rooting, licking, and hands to mouth", "Your nurse can help with positioning", "If you plan to formula feed, skin to skin still matters"], "narration": "Many babies are alert and ready to feed in the first hour after birth. Watch for early signs, like rooting, which is turning toward your chest with an open mouth, licking, or bringing hands to the mouth. If you're breastfeeding, skin to skin makes it easier for your baby to find the breast, and your nurse can help with positioning. There's no need for a perfect first latch. It's a first try for both of you. If you plan to formula feed, skin to skin is still wonderful for bonding and for keeping your baby warm.", "sourceIds": ["aap-breastfeeding-2022", "who-intrapartum-2018"], "visual": {"kind": "illustration", "description": "Newborn on parent's chest turning head toward the breast, mouth open, a nurse's hand offering gentle support."}}, {"id": "baby-checks", "type": "content", "heading": "Your baby's first checks", "onScreen": ["Apgar score at 1 and 5 minutes after birth", "Checks breathing, heart rate, color, tone, and reflexes", "Often done while baby is on your chest", "Weighing and newborn medications can usually wait"], "narration": "Your care team will quickly check your baby at one minute and five minutes after birth. This is called the Apgar score. It looks at breathing, heart rate, color, muscle tone, and reflexes, and it tells the team whether your baby needs any extra help adjusting. These checks can often be done while your baby is on your chest. Weighing, measuring, and routine newborn medications can usually wait until after that first hour together. We'll cover those medications in Module 5.", "sourceIds": ["acog-apgar", "aap-breastfeeding-2022"], "visual": {"kind": "icon-list", "description": "Five small icons for the Apgar categories: lungs (breathing), heart (heart rate), color swatch (color), flexed arm (tone), and a sneeze (reflexes)."}}, {"id": "your-recovery", "type": "content", "heading": "Your body in the first hour", "onScreen": ["Stitches for a tear, if needed, with numbing medicine", "Shaking or chills are common and pass", "Cramping as your uterus shrinks", "Bleeding, like a heavy period, is expected"], "narration": "While you're holding your baby, your provider will check for any tears and repair them if needed, using numbing medicine. Many people shake or feel chilled after birth. It's a common reaction and passes on its own, so ask for a warm blanket. You'll feel cramping as your uterus starts shrinking back down, and you'll have bleeding, similar to a heavy period. Your nurse will check you often. And if you're hungry and thirsty, ask for food and drink. You've earned it.", "sourceIds": ["acog-pb198", "who-intrapartum-2018"], "visual": {"kind": "illustration", "description": "Postpartum parent wrapped in a warm blanket, sipping juice, baby asleep on their chest, partner offering a snack."}}, {"id": "golden-hour-video", "type": "video", "heading": "The golden hour", "onScreen": ["Notice how much can happen with baby on your chest"], "narration": "Here's a short look at the first hour after birth.", "sourceIds": ["aap-breastfeeding-2022"], "video": {"brief": "Gentle, non-graphic footage or animation of the first hour: baby placed skin to skin, dried and covered, Apgar check done on the chest, delayed cord clamping with partner cutting the cord, baby rooting and a first feeding attempt, nurse checking the parent's uterus. Soft music and captions only.", "maxSeconds": 90}}, {"id": "heavy-bleeding", "type": "safety", "heading": "Heavy bleeding after birth: tell someone right away", "onScreen": ["Soaking through a pad in an hour or less", "Passing large clots", "Feeling dizzy, faint, or a racing heart", "In the hospital: press your call button now", "At home: call 911"], "narration": "Some bleeding after birth is normal. But heavy bleeding is an emergency, and it can happen in the hospital or after you go home. Get help right away if you're soaking through a pad in an hour or less, passing large clots, or feeling dizzy, faint, or like your heart is racing. In the hospital, press your call button and tell your nurse immediately. At home, call 911. Support people, if your partner seems pale, confused, or faint, don't wait. Get help.", "sourceIds": ["cdc-hear-her-warning-signs", "who-intrapartum-2018"]}, {"id": "checkin-bleeding", "type": "checkin", "heading": "Quick check-in", "onScreen": [], "narration": "One more check-in.", "sourceIds": ["cdc-hear-her-warning-signs"], "question": {"prompt": "Two hours after birth, you've soaked through a large pad in less than an hour and feel lightheaded. What should you do?", "options": ["Wait for the nurse's next routine check", "Press your call button and tell your nurse right away", "Change the pad and take a nap"], "correctIndex": 1, "explanation": "Soaking a pad in an hour or less, especially with dizziness, can be a sign of serious bleeding. Get help immediately."}}, {"id": "first-hour-wishes", "type": "reflection", "heading": "Your first-hour wishes", "onScreen": ["Skin to skin right away, and for how long", "Delayed cord clamping, and who cuts the cord", "First feeding plans", "Photos, quiet time, and when visitors are welcome"], "narration": "Let's capture your wishes for the first hour. Do you want skin to skin right away, and for how long? Delayed cord clamping, and who would like to cut the cord? Your first feeding plans? And what about photos, quiet time, and when visitors are welcome? Save it to your Birth Readiness Brief, and share it with your care team.", "sourceIds": [], "savesTo": "birthReadinessBrief", "prompt": "Write your wishes for skin to skin, cord clamping and cutting, first feeding, photos, quiet time, and visitors."}, {"id": "summary", "type": "summary", "heading": "What we covered", "onScreen": ["The placenta usually comes within about half an hour", "Medicine after birth helps prevent heavy bleeding", "Delayed cord clamping boosts baby's iron", "Skin to skin supports warmth, calm, and feeding", "Heavy bleeding: get help right away"], "narration": "Let's recap. The placenta usually comes within about half an hour, and medicine given after birth helps prevent heavy bleeding. Delayed cord clamping gives your baby extra blood and iron. Skin to skin keeps your baby warm and calm and supports that first feeding. And if you notice heavy bleeding, get help right away. That completes Labor Basics. Congratulations, you now know the whole journey from first contraction to first cuddle.", "sourceIds": ["acog-co814", "aap-breastfeeding-2022", "who-intrapartum-2018"]}], "reviewQuiz": [{"prompt": "Why is medicine like oxytocin usually given right after birth?", "options": ["To help the baby breathe", "To help the uterus contract and limit bleeding", "To start breast milk"], "correctIndex": 1, "explanation": "Oxytocin helps the uterus contract firmly, which is how the body controls bleeding after the placenta separates."}, {"prompt": "Which is a benefit of skin-to-skin contact right after birth?", "options": ["It helps keep baby warm and steadies breathing and heart rate", "It replaces the need for any newborn checks", "It's only for breastfeeding parents"], "correctIndex": 0, "explanation": "Skin to skin keeps babies warm and calm and helps steady breathing, heart rate, and blood sugar, whatever your feeding plan."}, {"prompt": "Which of these is a warning sign of heavy bleeding after birth?", "options": ["Bleeding like a heavy period", "Mild cramping", "Soaking through a pad in an hour or less"], "correctIndex": 2, "explanation": "Bleeding like a heavy period is expected, but soaking a pad in an hour or less, large clots, or dizziness mean get help right away."}]}];

const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;

const st = {
  mode: 'intro',        // intro | slides | quiz | done
  i: 0,                 // slide index
  q: 0,                 // quiz index
  score: 0,
  voice: !!synth,
  captions: true,
  playing: false,
  sent: 0,              // sentence index in narration
  run: 0,               // cancels stale speech callbacks
  narrationDone: false,
  answered: false,
  advanceTimer: null,
};

const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sentences(t){ return (t.match(/[^.!?]+[.!?]+["']?\s*/g) || [t]).map(s => s.trim()).filter(Boolean); }

/* ---------- Voice ---------- */
let chosenVoice = null;
function pickVoice(){
  if (!synth) return;
  const vs = synth.getVoices().filter(v => /^en(-|_)?/i.test(v.lang));
  let saved = null; try { saved = localStorage.getItem('voiceName'); } catch (e) {}
  const keep = saved && vs.find(v => v.name === saved);
  if (keep){ chosenVoice = keep; renderVoicePicker(); return; }
  const prefs = [/premium/i, /enhanced/i, /natural/i, /neural/i, /\bava\b/i, /\bzoe\b/i, /samantha/i, /aria/i, /jenny/i, /google us english/i, /allison/i];
  chosenVoice = null;
  for (const p of prefs){ const v = vs.find(v => p.test(v.name) && /en-US/i.test(v.lang)) || vs.find(v => p.test(v.name)); if (v){ chosenVoice = v; break; } }
  if (!chosenVoice) chosenVoice = vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
  renderVoicePicker();
}
function renderVoicePicker(){
  const sel = document.getElementById('voiceList'); if (!sel || !synth) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  const rank = v => (/premium|enhanced|natural|neural/i.test(v.name) ? 0 : 1);
  vs.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  sel.innerHTML = vs.map(v => `<option value="${esc(v.name)}"${chosenVoice && v.name === chosenVoice.name ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  sel.onchange = () => { chosenVoice = vs.find(v => v.name === sel.value) || chosenVoice; try { localStorage.setItem('voiceName', sel.value); } catch (e) {} previewVoice(); };
  const t = document.getElementById('voiceTry'); if (t) t.onclick = previewVoice;
}
function previewVoice(){
  if (!synth) return; synth.cancel();
  const u = new SpeechSynthesisUtterance("Welcome to Labor Basics. I'm so glad you're here.");
  if (chosenVoice) u.voice = chosenVoice; u.rate = 0.97; synth.speak(u);
}
if (synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }

function stopSpeech(){
  st.run++;
  if (synth) synth.cancel();
}

function currentNarration(){
  if (st.mode === 'slides') return SLIDES[st.i].narration;
  if (st.mode === 'quiz') return 'Review question ' + (st.q + 1) + ' of ' + LESSON.reviewQuiz.length + '.';
  return '';
}

function renderCaption(){
  const parts = sentences(currentNarration());
  caption.innerHTML = parts.map((s, k) => `<span class="s${k === st.sent && st.playing ? ' on' : ''}" data-k="${k}">${esc(s)} </span>`).join('');
  caption.classList.toggle('static', !st.voice || !st.playing);
  caption.hidden = !st.captions || !parts.join('').length;
  const on = caption.querySelector('.s.on');
  if (on) on.scrollIntoView({block:'nearest'});
}

function speakFrom(k){
  const parts = sentences(currentNarration());
  if (!st.voice || !synth || !parts.length){ st.playing = false; finishNarration(); return; }
  const run = ++st.run;
  synth.cancel();
  st.playing = true; st.sent = k; updateControls(); renderCaption();
  const say = (n) => {
    if (run !== st.run) return;
    if (n >= parts.length){ st.playing = false; renderCaption(); finishNarration(); return; }
    st.sent = n; renderCaption();
    const u = new SpeechSynthesisUtterance(parts[n]);
    if (chosenVoice) u.voice = chosenVoice;
    u.rate = 0.97; u.pitch = 1;
    u.onend = () => say(n + 1);
    u.onerror = () => { if (run === st.run){ st.playing = false; renderCaption(); updateControls(); } };
    synth.speak(u);
  };
  say(k);
}

function finishNarration(){
  st.narrationDone = true;
  updateControls();
  if (st.mode !== 'slides') return;
  const s = SLIDES[st.i];
  const autoTypes = ['title','content','comparison','summary'];
  if (st.voice && autoTypes.includes(s.type) && st.i < SLIDES.length - 1){
    clearTimeout(st.advanceTimer);
    st.advanceTimer = setTimeout(() => go(1), 1400);
  }
}

/* ---------- Visuals ---------- */
function visualHTML(s){
  if (s.id === 'when-labor-starts') return `<div class="visual">${timelineSVG()}</div>`;
  if (s.id === 'what-is-a-contraction') return `<div class="visual">${waveSVG()}</div>`;
  if (s.id === 'water-breaking') return `<div class="visual">${iconsSVG()}</div>`;
  if (s.type === 'comparison'){
    return `<div class="visual" style="padding:6px;overflow-x:auto"><table class="cmp${s.id === 'two-kinds-of-calls' ? ' alert' : ''}"><thead><tr><th>${esc(s.columns[0])}</th><th>${esc(s.columns[1])}</th></tr></thead><tbody>${s.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if (s.visual) return `<div class="visual placeholder"><strong>Artwork to come</strong>${esc(s.visual.description)}</div>`;
  return '';
}
function timelineSVG(){
  const x = w => 20 + (w - 34) * 40; // 34..42 weeks → 20..340
  const zone = (a, b, fill, label) => `<rect x="${x(a)}" y="40" width="${x(b) - x(a)}" height="34" rx="6" fill="${fill}"/><text x="${(x(a) + x(b)) / 2}" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${label}</text>`;
  let ticks = '';
  for (let w = 34; w <= 42; w++) ticks += `<text x="${x(w)}" y="94" text-anchor="middle" font-size="11" fill="var(--muted)">${w}</text>`;
  return `<svg viewBox="0 0 360 110" role="img" aria-label="Timeline: before 37 weeks preterm, 37 to 38 early term, 39 to 40 full term, 41 to 42 late term; due date at 40 weeks">
    ${zone(34,37,'var(--alert-soft)','Preterm')}${zone(37,39,'var(--marigold-soft)','Early term')}${zone(39,41,'var(--lagoon-soft)','Full term')}${zone(41,42,'var(--line)','Late')}
    <line x1="${x(40)}" y1="28" x2="${x(40)}" y2="40" stroke="var(--ink)" stroke-width="2"/><line x1="${x(40)}" y1="74" x2="${x(40)}" y2="82" stroke="var(--ink)" stroke-width="2"/>
    <text x="${x(40)}" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Due date</text>${ticks}
    <text x="180" y="108" text-anchor="middle" font-size="10" fill="var(--muted)">weeks of pregnancy</text></svg>`;
}
function waveSVG(){
  return `<svg viewBox="0 0 360 120" role="img" aria-label="Two contraction waves: each builds, peaks, and eases, with rest between">
    <path d="M10 95 C 50 95, 60 25, 90 25 S 130 95, 170 95 L 190 95 C 230 95, 240 25, 270 25 S 310 95, 350 95" fill="none" stroke="var(--lagoon)" stroke-width="4" stroke-linecap="round"/>
    <text x="90" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Peak</text>
    <text x="40" y="114" text-anchor="middle" font-size="11" fill="var(--muted)">Builds</text>
    <text x="140" y="114" text-anchor="middle" font-size="11" fill="var(--muted)">Eases</text>
    <text x="180" y="86" text-anchor="middle" font-size="11" fill="var(--muted)">Rest</text></svg>`;
}
function iconsSVG(){
  const item = (cx, body, label) => `<g><circle cx="${cx}" cy="45" r="32" fill="var(--lagoon-soft)"/>${body}<text x="${cx}" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${label}</text></g>`;
  return `<svg viewBox="0 0 360 112" role="img" aria-label="Note the time, note the color, call your care team">
    ${item(60, `<circle cx="60" cy="45" r="16" fill="none" stroke="var(--lagoon)" stroke-width="3"/><path d="M60 36v10l7 5" stroke="var(--lagoon)" stroke-width="3" fill="none" stroke-linecap="round"/>`, 'Note the time')}
    ${item(180, `<path d="M180 27 C 170 42, 166 49, 166 55 a14 14 0 0 0 28 0 c0-6-4-13-14-28z" fill="var(--lagoon)"/>`, 'Note the color')}
    ${item(300, `<rect x="290" y="27" width="20" height="36" rx="4" fill="none" stroke="var(--lagoon)" stroke-width="3"/><circle cx="300" cy="57" r="2.5" fill="var(--lagoon)"/>`, 'Call your team')}
  </svg>`;
}
function sourcesHTML(ids){
  if (!ids || !ids.length) return '';
  return `<div class="sources">${ids.map(id => SRC[id]).filter(Boolean).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.organization)}: ${esc(s.title)}</a>`).join('')}</div>`;
}

/* ---------- Slides ---------- */
function renderIntro(){
  stage.innerHTML = `<section class="slide title-slide">
    <div class="lessonpick" role="group" aria-label="Choose a lesson">${LESSONS.map((l, k) => `<button type="button" data-l="${k}" aria-pressed="${l === LESSON}">${l.order}. ${esc(l.title)}</button>`).join('')}</div>
    <p class="kicker">BabyReady · Labor Basics · Lesson ${LESSON.order}</p>
    <h1>${esc(LESSON.title)}</h1>
    <p>A short class, about ${LESSON.estimatedMinutes} minutes. Your instructor will talk you through each slide, with a couple of quick check-ins along the way.</p>
    <ul class="points">${LESSON.learningGoals.map(g => `<li>${esc(g)}</li>`).join('')}</ul>
    <p style="color:var(--muted);font-size:14px">Turn your sound on. ${synth ? '' : 'This browser can’t speak aloud, so captions will carry the narration.'}</p>
    ${synth ? `<div class="voicebox"><label for="voiceList">Instructor voice</label><div class="vrow"><select id="voiceList"></select><button type="button" class="ctl" id="voiceTry">Preview</button></div><p class="tip">Voices marked Premium or Enhanced sound the most natural. On iPhone, download them in Settings → Accessibility → Spoken Content → Voices → English, then reopen this page.</p></div>` : ''}
  </section>`;
  caption.hidden = true;
  nextBtn.textContent = 'Start';
  renderVoicePicker();
  stage.querySelectorAll('.lessonpick button').forEach(b => b.addEventListener('click', () => loadLesson(+b.dataset.l)));
  stage.querySelector('.lessonpick button[aria-pressed="true"]')?.scrollIntoView({block: 'nearest', inline: 'center'});
  updateControls();
}

function renderSlide(){
  const s = SLIDES[st.i];
  st.narrationDone = false; st.answered = false; st.sent = 0;
  const pts = s.onScreen.length ? `<ul class="points">${s.onScreen.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : '';
  let body = '';
  if (s.type === 'title'){
    body = `<section class="slide title-slide"><p class="kicker">${esc(s.onScreen.join(' · '))}</p><h1>${esc(s.heading)}</h1>${visualHTML(s)}</section>`;
  } else if (s.type === 'checkin'){
    const q = s.question;
    body = `<section class="slide"><span class="badge">Check-in</span><p class="question">${esc(q.prompt)}</p>
      <div class="opts">${q.options.map((o, k) => `<button class="opt" type="button" data-k="${k}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>
      <div id="explain"></div></section>`;
  } else if (s.type === 'safety'){
    body = `<section class="slide safety" role="alert"><h1>${esc(s.heading)}</h1>${pts}
      <a class="call911" href="tel:911">Call 911</a>${sourcesHTML(s.sourceIds)}</section>`;
  } else if (s.type === 'video'){
    body = `<section class="slide"><h1>${esc(s.heading)}</h1>
      <div class="video-frame"><div><div class="play">${PLAY_ICON}</div><strong>Video to come (up to ${Math.round(s.video.maxSeconds)} seconds)</strong><br>${esc(s.video.brief)}</div></div>
      <div style="height:12px"></div>${pts}${sourcesHTML(s.sourceIds)}</section>`;
  } else if (s.type === 'reflection'){
    let saved = '';
    try { saved = localStorage.getItem('brief:' + s.id) || ''; } catch (e) {}
    body = `<section class="slide"><h1>${esc(s.heading)}</h1>${pts}
      <label for="refl" style="display:block;font-weight:700;margin-bottom:6px">${esc(s.prompt)}</label>
      <textarea id="refl">${esc(saved)}</textarea>
      <div class="saved" id="savedNote">${saved ? 'Saved to your Birth Readiness Brief' : ''}</div>${sourcesHTML(s.sourceIds)}</section>`;
  } else {
    body = `<section class="slide"><h1>${esc(s.heading)}</h1>${visualHTML(s)}${pts}${sourcesHTML(s.sourceIds)}</section>`;
  }
  stage.innerHTML = body;
  stage.scrollTop = 0;

  if (s.type === 'checkin') wireCheckin(s.question, () => { st.answered = true; updateControls(); });
  if (s.type === 'reflection'){
    const ta = $('refl'); let t;
    ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => {
      try { localStorage.setItem('brief:' + s.id, ta.value); $('savedNote').textContent = 'Saved to your Birth Readiness Brief'; }
      catch (e) { $('savedNote').textContent = 'Couldn’t save on this device. Copy your notes somewhere safe.'; }
    }, 500); });
  }
  updateControls();
  speakFrom(0);
}

function wireCheckin(q, onDone){
  const btns = [...stage.querySelectorAll('.opt')];
  btns.forEach(b => b.addEventListener('click', () => {
    if (btns.some(x => x.getAttribute('aria-pressed') === 'true')) return;
    const k = +b.dataset.k, right = k === q.correctIndex;
    b.setAttribute('aria-pressed', 'true');
    b.classList.add(right ? 'right' : 'wrong');
    if (!right) btns[q.correctIndex].classList.add('reveal');
    $('explain').innerHTML = `<div class="explain"><strong>${right ? 'That’s right.' : 'Not quite.'}</strong> ${esc(q.explanation)}</div>`;
    if (st.mode === 'quiz' && right) st.score++;
    stopSpeech(); st.playing = false;
    if (st.voice && synth){
      const u = new SpeechSynthesisUtterance((right ? 'That’s right. ' : 'Not quite. ') + q.explanation);
      if (chosenVoice) u.voice = chosenVoice; u.rate = 0.97; synth.speak(u);
    }
    onDone();
  }));
}

/* ---------- Quiz ---------- */
function renderQuiz(){
  const q = LESSON.reviewQuiz[st.q];
  st.answered = false; st.sent = 0;
  stage.innerHTML = `<section class="slide"><span class="badge">Review ${st.q + 1} of ${LESSON.reviewQuiz.length}</span>
    <p class="question">${esc(q.prompt)}</p>
    <div class="opts">${q.options.map((o, k) => `<button class="opt" type="button" data-k="${k}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>
    <div id="explain"></div></section>`;
  wireCheckin(q, () => { st.answered = true; updateControls(); });
  updateControls();
  speakFrom(0);
}
function renderDone(){
  stopSpeech(); st.playing = false;
  const n = LESSON.reviewQuiz.length;
  const nextL = LESSONS[LESSONS.indexOf(LESSON) + 1];
  stage.innerHTML = `<section class="slide title-slide"><p class="kicker">Lesson complete</p>
    <div class="result">${st.score}/${n}</div>
    <h1 style="font-size:28px">Nice work finishing ${esc(LESSON.title)}</h1>
    <p>${nextL ? `Next up: <strong>${esc(nextL.title)}</strong>. ` : `That's the end of this preview. `}You can replay this lesson anytime, or tap Ask with any questions.</p></section>`;
  caption.hidden = true;
  updateControls();
  if (st.voice && synth){
    const u = new SpeechSynthesisUtterance('Nice work. You finished the lesson.' + (nextL ? ' Next up, ' + nextL.title + '.' : ''));
    if (chosenVoice) u.voice = chosenVoice; synth.speak(u);
  }
}

/* ---------- Navigation ---------- */
function go(d){
  clearTimeout(st.advanceTimer);
  stopSpeech(); st.playing = false;
  if (st.mode === 'intro'){ st.mode = 'slides'; st.i = 0; return show(); }
  if (st.mode === 'slides'){
    const n = st.i + d;
    if (n < 0) return;
    if (n >= SLIDES.length){ st.mode = 'quiz'; st.q = 0; st.score = 0; return show(); }
    st.i = n; return show();
  }
  if (st.mode === 'quiz'){
    if (d < 0){ st.mode = 'slides'; st.i = SLIDES.length - 1; return show(); }
    if (st.q + 1 >= LESSON.reviewQuiz.length){ st.mode = 'done'; return show(); }
    st.q++; return show();
  }
  if (st.mode === 'done' && d < 0){ st.mode = 'quiz'; st.q = LESSON.reviewQuiz.length - 1; return show(); }
  if (st.mode === 'done' && d > 0){ const nx = LESSONS.indexOf(LESSON) + 1; if (nx < LESSONS.length) return loadLesson(nx); st.mode = 'slides'; st.i = 0; st.score = 0; return show(); }
}
function show(){
  if (st.mode === 'intro') renderIntro();
  else if (st.mode === 'slides') renderSlide();
  else if (st.mode === 'quiz') renderQuiz();
  else renderDone();
  renderSegments();
}

function renderSegments(){
  const total = SLIDES.length + 1;
  const pos = st.mode === 'intro' ? -1 : st.mode === 'slides' ? st.i : st.mode === 'quiz' ? SLIDES.length : total;
  $('segments').innerHTML = Array.from({length: total}, (_, k) => `<span class="${k < pos ? 'done' : k === pos ? 'now' : ''}"></span>`).join('');
}

function updateControls(){
  const app = $('app');
  app.classList.remove('safety-mode');
  prevBtn.disabled = st.mode === 'intro' || (st.mode === 'slides' && st.i === 0);
  playBtn.innerHTML = st.playing ? PAUSE_ICON : PLAY_ICON;
  playBtn.setAttribute('aria-label', st.playing ? 'Pause narration' : 'Play narration');
  playBtn.disabled = !st.voice || st.mode === 'intro' || st.mode === 'done';
  $('voice').textContent = st.voice ? 'Voice' : 'Muted';
  $('voice').setAttribute('aria-pressed', String(st.voice));
  $('voice').disabled = !synth;
  $('cc').setAttribute('aria-pressed', String(st.captions));
  nextBtn.disabled = false;
  if (st.mode === 'intro'){ nextBtn.textContent = 'Start'; return; }
  if (st.mode === 'done'){ nextBtn.textContent = LESSONS.indexOf(LESSON) + 1 < LESSONS.length ? 'Next lesson' : 'Replay'; return; }
  if (st.mode === 'quiz'){
    nextBtn.textContent = st.q + 1 >= LESSON.reviewQuiz.length ? 'Results' : 'Next';
    nextBtn.disabled = !st.answered; return;
  }
  const s = SLIDES[st.i];
  nextBtn.textContent = st.i === SLIDES.length - 1 ? 'Quiz' : 'Next';
  if (s.type === 'checkin'){ nextBtn.textContent = 'Continue'; nextBtn.disabled = !st.answered; }
  if (s.type === 'safety'){
    app.classList.add('safety-mode');
    nextBtn.textContent = 'Got it';
    nextBtn.disabled = st.voice && synth ? !st.narrationDone : false;
  }
}

nextBtn.addEventListener('click', () => go(1));
prevBtn.addEventListener('click', () => go(-1));
playBtn.addEventListener('click', () => {
  clearTimeout(st.advanceTimer);
  if (st.playing){ const k = st.sent; stopSpeech(); st.playing = false; st.sent = k; renderCaption(); updateControls(); }
  else speakFrom(st.narrationDone ? 0 : st.sent);
});
$('voice').addEventListener('click', () => {
  st.voice = !st.voice;
  clearTimeout(st.advanceTimer);
  if (!st.voice){ stopSpeech(); st.playing = false; st.narrationDone = true; }
  renderCaption(); updateControls();
});
$('cc').addEventListener('click', () => { st.captions = !st.captions; renderCaption(); updateControls(); });

/* ---------- Ask a question ---------- */
const URGENT = [
  /\bbleed(ing)?\b/i, /\bheavy (blood|flow)\b/i,
  /(can'?t|cannot|trouble|hard to|difficulty) breath/i, /\bchest pain\b/i, /heart (is )?(racing|pounding)/i,
  /\bsevere\b/i, /\bseizure|convuls/i, /\bfaint(ed|ing)?\b|passed out/i,
  /(not|stopped|less|isn'?t|hasn'?t been|reduced|decreased|fewer) (feel(ing)? )?(the )?(baby )?(mov|kick)/i,
  /\bfever\b/i, /\b(blurr|vision|seeing spots)/i, /headache (that )?(won'?t|will not|isn'?t) go/i,
  /hurt (myself|my baby)|kill myself|suicid/i
];
const NOW_WATER = /\b(my )?water (just )?(broke|broken|is breaking)\b|\bleaking fluid\b/i;

  'how-labor-begins': ['What is bloody show?', 'How do I time contractions?', 'What are Braxton Hicks?', 'What does early term mean?'],
  'when-to-contact-your-care-team': ['What does 5-1-1 mean?', 'What is group B strep?', 'What will the nurse ask me?', 'Is it okay to call at night?'],
  'stages-of-labor': ['What is effacement?', 'When does active labor start?', 'What is transition?', 'How long does pushing take?'],
  'early-labor-at-home': ['Can I eat during early labor?', 'Should I rest or walk?', 'Can I take a bath?', 'How often should I time contractions?'],
  'pushing-and-birth': ['What does crowning feel like?', 'Will I tear?', 'What is an episiotomy?', 'Can I push with an epidural?'],
  'placenta-and-first-hour': ['Why wait to clamp the cord?', 'What is skin to skin?', 'What is an Apgar score?', 'How much bleeding is normal?']
};
function renderChips(){ $('chips').innerHTML = (CHIPS[LESSON.lessonId] || []).map(c => `<button type="button">${esc(c)}</button>`).join(''); }
renderChips();
$('chips').addEventListener('click', e => { if (e.target.tagName === 'BUTTON'){ $('q').value = e.target.textContent; ask(); } });

let samplePromise = null, askCtl = null, wasPlaying = false;
function getSample(){
  if (!samplePromise) samplePromise = (window.claude && claude.use) ? claude.use('sample').catch(() => null) : Promise.resolve(null);
  return samplePromise;
}
getSample();

function openSheet(){
  wasPlaying = st.playing;
  clearTimeout(st.advanceTimer);
  if (st.playing){ const k = st.sent; stopSpeech(); st.playing = false; st.sent = k; renderCaption(); updateControls(); }
  $('sheetBack').classList.add('open'); $('sheet').classList.add('open');
  setTimeout(() => $('q').focus(), 50);
}
function closeSheet(){
  askCtl?.abort();
  $('sheetBack').classList.remove('open'); $('sheet').classList.remove('open');
  $('askOpen').focus();
  if (wasPlaying && st.mode !== 'intro') speakFrom(st.sent);
}
$('askOpen').addEventListener('click', openSheet);
$('askClose').addEventListener('click', closeSheet);
$('sheetBack').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheet').classList.contains('open')) closeSheet(); });
$('askSend').addEventListener('click', ask);

function lessonText(){
  return SLIDES.map(s => {
    let t = `## ${s.heading}\n${s.onScreen.join('\n')}\n${s.narration}`;
    if (s.rows) t += '\n' + s.rows.map(r => `${s.columns[0]}: ${r[0]} | ${s.columns[1]}: ${r[1]}`).join('\n');
    if (s.question) t += `\nQ: ${s.question.prompt}\nA: ${s.question.options[s.question.correctIndex]}. ${s.question.explanation}`;
    return t;
  }).join('\n\n');
}

async function ask(){
  const q = $('q').value.trim();
  const out = $('answer');
  if (!q){ out.innerHTML = '<p class="answer">Type a question first, or tap one of the examples.</p>'; return; }

  // Safety routing runs first and never goes to the AI.
  if (URGENT.some(r => r.test(q))){
    out.innerHTML = `<div class="urgent"><strong>This sounds like it could need attention now.</strong><br>
      Contact your care team right away. If it feels like an emergency, call 911. This class can’t assess symptoms.
      <a class="call911" href="tel:911">Call 911</a></div>`;
    return;
  }
  if (NOW_WATER.test(q)){
    out.innerHTML = `<div class="urgent"><strong>Call your care team now.</strong><br>
      When your water breaks, your care team wants to hear from you, even without contractions. Note the time and what the fluid looks like. If anything feels like an emergency, call 911.</div>`;
    return;
  }

  const sample = await getSample();
  if (!sample){
    out.innerHTML = '<p class="answer">Questions aren’t available in this view. Open this page in the Claude app to try them.</p>';
    return;
  }
  askCtl?.abort(); askCtl = new AbortController();
  $('askSend').disabled = true;
  out.innerHTML = '<p class="answer" id="ans">Thinking...</p>';
  const prompt = `You are the question helper inside BabyReady, a childbirth education class. Answer the learner's question using ONLY the lesson content below.
Rules:
- Warm, plain language at about a 6th-grade reading level. 2 to 4 short sentences. No markdown, no lists.
- If the lesson does not cover the question, say so in one sentence and suggest asking their care team. Do not answer from outside knowledge.
- Never diagnose, never tell someone whether they are in labor, and never give medication or dosing advice.
- If the question describes a symptom happening right now, tell them to contact their care team, or call 911 if it feels like an emergency.
- On the final line write "From: " followed by the slide heading(s) you used, or "From: not covered in this lesson".

LESSON: ${LESSON.title}
${lessonText()}

LEARNER'S QUESTION: ${q}`;
  try {
    const { text } = await sample(prompt, {
      modelTier: 'quick', signal: askCtl.signal,
      onText: ({ text }) => { const el = $('ans'); if (el) el.textContent = text; }
    });
    const m = text.match(/\n?From:\s*(.+)\s*$/i);
    const main = m ? text.slice(0, m.index).trim() : text.trim();
    out.innerHTML = `<p class="answer">${esc(main)}${m ? `<span class="from">From: ${esc(m[1])}</span>` : ''}</p>`;
  } catch (e) {
    const msg = {
      not_granted: 'Questions are turned off for this page. You can allow them from the page’s permissions.',
      rate_limited: 'Lots of questions at once. Wait a moment, then ask again.',
      cancelled: ''
    }[e.code] ?? 'Something went wrong getting an answer. Try asking again.';
    out.innerHTML = msg ? `<p class="answer">${esc(msg)}</p>` : '';
  } finally {
    $('askSend').disabled = false;
  }
}

/* ---------- Start ---------- */
function loadLesson(n){
  clearTimeout(st.advanceTimer); stopSpeech();
  LESSON = LESSONS[n]; SLIDES = LESSON.slides;
  SRC = Object.fromEntries(LESSON.sources.map(s => [s.id, s]));
  Object.assign(st, { mode: 'intro', i: 0, q: 0, score: 0, playing: false, sent: 0, narrationDone: false, answered: false });
  $('lessonTitle').textContent = LESSON.title;
  $('answer').innerHTML = ''; $('q').value = '';
  renderChips(); show();
}
$('lessonTitle').textContent = LESSON.title;
show();
</script>
